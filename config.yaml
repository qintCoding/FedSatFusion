# 数据配置
data:
  data_dir: "data/sen12ms"  # 改回正确的数据集路径
  batch_size: 32
  num_workers: 4

# 模型配置
model:
  num_classes: 17
  input_channels:
    sar: 2  # VV和VH通道
    optical: 13  # 所有光学波段

# 训练配置
training:
  epochs: 100
  learning_rate: 0.001
  early_stopping_patience: 10
  checkpoint_dir: "checkpoints"
  device: "cuda"  # 或 "cpu"

optimizer:
  type: "adam"
  weight_decay: 0.0001

scheduler:
  type: "reduce_on_plateau"
  patience: 5
  factor: 0.5
  min_lr: 0.00001 